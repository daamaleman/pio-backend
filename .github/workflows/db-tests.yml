name: Database tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pgtap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Full local stack (Auth, Storage, etc.): some migrations need their schemas.
      # Slower than db start (~2–3 min) but identical to local development.
      - run: supabase start

      - run: supabase test db

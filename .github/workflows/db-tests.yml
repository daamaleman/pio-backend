name: Database tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pgtap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Starts Postgres only, applies every migration and the seed
      - run: supabase db start

      - run: supabase test db
